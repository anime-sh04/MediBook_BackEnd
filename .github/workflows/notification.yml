name: Deploy Notification Service

on:
  push:
    branches:
      - main
    paths:
      - 'notification-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Notification
        run: dotnet publish ./notification-service/src/MediBook.Notification.API/MediBook.Notification.API.csproj -c Release -o ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: medibook-notification
          publish-profile: ${{ secrets.NOTIFICATION_PUBLISH_PROFILE }}
          package: ./publish