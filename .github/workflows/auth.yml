name: Deploy Auth Service

on:
  push:
    branches:
      - main
    paths:
      - 'auth-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Auth Service
        run: dotnet publish ./auth-service/src/MediBook.Auth.API/MediBook.Auth.API.csproj -c Release -o publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: medibook-auth
          publish-profile: ${{ secrets.AUTH_PUBLISH_PROFILE }}
          package: ./publish