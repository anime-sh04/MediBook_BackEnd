name: Deploy Review Service

on:
  push:
    branches:
      - main
    paths:
      - 'review-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Review
        run: dotnet publish ./review-service/src/MediBook.Review.API/MediBook.Review.API.csproj -c Release -o ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: medibook-review
          publish-profile: ${{ secrets.REVIEW_PUBLISH_PROFILE }}
          package: ./publish