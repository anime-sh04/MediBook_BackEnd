name: Deploy Provider Service

on:
  push:
    branches:
      - main
    paths:
      - 'provider-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Provider
        run: dotnet publish ./provider-service/src/MediBook.Provider.API/MediBook.Provider.API.csproj -c Release -o ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: medibook-provider
          publish-profile: ${{ secrets.PROVIDER_PUBLISH_PROFILE }}
          package: ./publish