name: Deploy Payment Service

on:
  push:
    branches:
      - main
    paths:
      - 'payment-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish Payment
        run: dotnet publish ./payment-service/src/MediBook.Payment.API/MediBook.Payment.API.csproj -c Release -o ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: medibook-payment
          publish-profile: ${{ secrets.PAYMENT_PUBLISH_PROFILE }}
          package: ./publish